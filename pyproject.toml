[project]
name = "concert-reminder"
version = "0.1.0"
description = "Discord bot + web UI for tracking Japanese concert deadlines (lotteries, ticket sales, streams)"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "tzdata>=2024.1",  # IANA tz database: Windows has none; harmless on Linux
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]  # Depends() in defaults is the FastAPI idiom

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E402", "E501", "I001"]  # generated + sys.path bootstrap

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
