# Draft 2: a single-leg talk/radio show (class D -- catalogued by the
# 2026-08-02 scope ruling, same as a concert). It also demonstrates the
# OTHER collapse: Eventernote lists this as two leads -- 第1部 (id 481671)
# and 第2部 (id 483251), same date and venue -- but a per-part split is not a
# tour's legs, it is one event recorded once (see the taxonomy doc's
# headline finding). This draft carries a single performance covering both
# parts and says so in its notes, rather than becoming two legs.
title: 「Liyuuのはつらじ にゅ！〜1周年記念パーティー〜」
