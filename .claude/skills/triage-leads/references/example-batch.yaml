notes_en: Recorded as one performance covering both Part 1 (18:30) and Part 2 (20:30). Eventernote lists these as two separate leads (481671 and 483251) -- the per-part-split pattern from the discovery taxonomy, which collapses to one event rather than two legs.
notes_zh: 作为一场演出记录，涵盖第1部（18:30开演）和第2部（20:30开演）。Eventernote将其列为两条独立线索（481671和483251）。
