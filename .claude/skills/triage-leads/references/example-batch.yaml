# Example batch for the triage-leads skill -- what /concerts/import/draft
# expects pasted into its textarea, once a batch of leads survives the prune
# pass. Parsed by app.domain.yaml_import.parse_drafts: a plain YAML stream,
# `---`-separated, no wrapper key. Each document is exactly one
# .claude/skills/add-concert draft, and each must be COMPLETE on its own --
# a document is stored verbatim in a PendingDraft row and re-parsed later at
# review time, so nothing here may depend on its neighbours.
#
# Both concerts below, and every id, venue, date and time on them, are real
# leads read off tests/fixtures/eventernote_actor_events.html -- not
# invented, so this teaches the shapes that actually occur in the discovery
# queue rather than a shape that looks plausible.

# Draft 1: a genuine multi-leg tour (the collapse rule's easy case). Two
# Eventernote leads -- Day.1 (id 464371) and Day.2 (id 464372) -- are the
# SAME two-night stand at one venue, so they become ONE concert with TWO
# legs, not two concerts. This is the taxonomy doc's own class-A example
# ("LoveLive! Series 15th Anniversary ラブライブ！フェス（バンテリンドーム）").
