<!-- TEMPORARY measurement harness for the tablet-band brainstorm.
     Not part of the demo set; delete before committing anything. -->
<meta charset="utf-8">
<title>tablet harness</title>
<style>
  body { margin: 0; background: #333; font: 12px monospace; color: #eee; }
  #bar { padding: 4px 8px; }
  iframe { display: block; margin: 0 auto; border: 0; background: #fff; height: 1400px; }
</style>
<div id="bar"></div>
<iframe id="f"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const w = parseInt(q.get("w") || "820", 10);
  const src = q.get("src") || "dekimasen-demo.html";
  const view = q.get("view") || "";
  const scroll = parseInt(q.get("scroll") || "0", 10);
  const f = document.getElementById("f");
  f.style.width = w + "px";
  document.getElementById("bar").textContent =
    `viewport ${w}px — ${src}${view ? " / view: " + view : ""}`;
  f.src = src;
  f.addEventListener("load", () => {
    try {
      const win = f.contentWindow;
      if (view && typeof win.show === "function") win.show(view);
      if (scroll) win.scrollTo(0, scroll);
      document.getElementById("bar").textContent +=
        ` — iframe innerWidth: ${win.innerWidth}px`;
    } catch (e) {
      document.getElementById("bar").textContent += " — " + e;
    }
  });
</script>
