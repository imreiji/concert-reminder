<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}dekimasen.app{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body data-tz="{{ tz or '' }}" data-tz-auto="{{ '1' if tz_auto else '0' }}">
  <header class="site">
    <a class="home" href="/"><span class="mark">できません</span><span class="wordmark">dekimasen.app</span></a>
    <nav class="auth">
      {% if user %}
        <img class="avatar" src="{{ user.avatar_url }}" alt="">
        <span>{{ user.username }}{% if user.is_editor %} <em class="badge">editor</em>{% endif %}</span>
        <a href="/auth/logout">log out</a>
      {% else %}
        <a class="login" href="/auth/login">Sign in with Discord</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>times are entered in <strong>JST</strong> and shown as JST + your local time</footer>
{% if user %}
  <script>
    // Auto-detect timezone from the browser; respected only while the user
    // hasn't chosen one manually (data-tz-auto). Fire-and-forget.
    (function () {
      try {
        var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        var b = document.body;
        if (tz && b.dataset.tzAuto === "1" && tz !== b.dataset.tz) {
          fetch("/me/timezone/auto", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "timezone=" + encodeURIComponent(tz),
          }).then(function () { location.reload(); });
        }
      } catch (e) { /* older browsers: keep stored tz */ }
    })();
  </script>
{% endif %}
</body>
</html>
