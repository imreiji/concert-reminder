<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}concert-reminder{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site">
    <span class="mark">開演</span>
    <span class="wordmark">concert-reminder</span>
    <nav class="auth">
      {% if user %}
        <img class="avatar" src="{{ user.avatar_url }}" alt="">
        <span>{{ user.username }}{% if user.is_editor %} <em class="badge">editor</em>{% endif %}</span>
        <a href="/auth/logout">log out</a>
      {% else %}
        <a class="login" href="/auth/login">Sign in with Discord</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
