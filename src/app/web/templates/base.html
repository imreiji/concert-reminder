<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}dekimasen.app{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <header class="site">
    <a class="home" href="/"><span class="mark">できません</span><span class="wordmark">dekimasen.app</span></a>
    <nav class="auth">
      {% if user %}
        <img class="avatar" src="{{ user.avatar_url }}" alt="">
        <span>{{ user.username }}{% if user.is_editor %} <em class="badge">editor</em>{% endif %}</span>
        <a href="/auth/logout">log out</a>
      {% else %}
        <a class="login" href="/auth/login">Sign in with Discord</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>times are entered in <strong>JST</strong> and shown as JST + your local time</footer>
</body>
</html>
